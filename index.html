<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 0 - Contact Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="site-header">
    <div class="logo">Carpet House</div>

    <nav class="site-nav">
        <a href="index.html" class="active">Task 0</a>
        <a href="task1.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="task3.html">Task 3</a>
        <a href="task4.html">Task 4</a>
    </nav>
</header>

<main>
    <section class="contact">
        <h2>Contact Us</h2>
        <p>
            Have a question about our carpets?
            Fill out the form below to contact us.
        </p>

        <form>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"></textarea>
            </div>

            <button type="submit">Submit</button>
        </form>
    </section>
</main>

<footer>
    <p>© 2026 Carpet House</p>
    <p>Contacts</p>
    <a href="https://github.com/xelllion" target="_blank">GitHub</a>
</footer>

</body>
</html>
